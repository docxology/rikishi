paper:
  title: Rikishi
  subtitle: Reproducible operation and analysis of the Suggested Upper Merged Ontology
  date: "{{DOCUMENT_LABEL}}"
  year: "{{DOCUMENT_YEAR}}"
  cover:
    image: figures/graphical-abstract.png
    alt: SUMO source hierarchy, reproducible operator evidence, and finite variational inference
  graphical_abstracts:
    - image: figures/abstract-source.png
      title: From ontology commitments to finite mathematics
      alt: Complete SUMO representation rules, declared Boolean probability inputs, and separate Lean and numerical obligations
      summary: A source formula, a mathematical law, and a calculation answer different questions. The shared witness makes their relationship inspectable.
    - image: figures/abstract-witness.png
      title: Shared finite witnesses and exact posterior inference
      alt: Three rational finite models with exact posteriors and their candidate divergence curves
      summary: The same prior, observation kernel, candidate distribution, and observed outcome enter every evidence lane. Exact arithmetic identifies what the calculation should return.
    - image: figures/abstract-evidence.png
      title: Evidence for models representations calculations and results
      alt: Distinct model, representation, calculation, and result roles connected to ontology, Lean, and numerical evidence
      summary: Evidence attaches to specific claims about specific artifacts. Shared identifiers connect the lanes without replacing their separate proof and measurement obligations.
