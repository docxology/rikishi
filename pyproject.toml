[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rikishi"
version = "0.1.0"
description = "A reproducible SUMO ontology workbench with source provenance, inference, and FEP research connections"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Daniel Ari Friedman"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.10,<2",
  "numpy>=2,<3", "matplotlib>=3.9,<4", "pyyaml>=6,<7",
  "python-docx>=1.1,<2", "pillow>=11,<13", "defusedxml>=0.7,<1",
  "pydantic>=2.10,<3",
]

[project.scripts]
rikishi = "rikishi.cli:main"
rikishi-mcp = "rikishi.mcp_server:main"
rikishi-check-coverage = "rikishi.quality:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
markers = ["integration: installed upstream tools or full corpus required"]

[tool.coverage.run]
source = ["src/rikishi"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/rikishi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/config", "/examples", "/skills", "/.agents",
  "/manuscript", "/docs", "/tests", "/README.md", "/AGENTS.md", "/CITATION.cff",
  "/LICENSE", "/uv.lock", "/.python-version"]
